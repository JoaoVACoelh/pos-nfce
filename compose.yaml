# POS development environment. Nothing here changes the machine's XAMPP.
name: pos-nfce

services:
  app:
    build: ./docker/php
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      TZ: America/Sao_Paulo
      MARIADB_DATABASE: pos
      MARIADB_USER: pos
      MARIADB_PASSWORD: pos
      MARIADB_ROOT_PASSWORD: root
    ports:
      # 3307 on the host to avoid clashing with XAMPP's MariaDB (3306)
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
